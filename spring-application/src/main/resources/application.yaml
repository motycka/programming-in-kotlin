server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:hellodb
    username: admin
    password: admin
    driverClassName: org.h2.Driver
  jpa:
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate.ddl-auto: update
  jooq:
    sql-dialect: H2
  h2:
    console.enabled: true
